<!doctype html>
<!-- A dark theme the site chose itself (like YouTube's html[dark]), not from prefers-color-scheme. -->
<html lang="en" dark>
<head>
<meta charset="utf-8">
<title>Saved dark theme</title>
<style>
  body { margin: 0; padding: 24px; font: 16px system-ui; min-height: 100vh; box-sizing: border-box; }
  html[dark] body { background: #181818; color: #eee; }
</style>
</head>
<body><h1>Saved dark theme</h1><p>The site keeps this theme whatever the browser says.</p></body>
</html>
