<!doctype html>
<!-- The ways a page goes fullscreen: a player element, the video itself, an embedded player's
     frame, and a player element with a frame inside it. The embed can also make its own player
     fullscreen (test/embed.html). -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Fullscreen</title>
<style>
  body { margin: 0; padding: 8px; background: #fff; display: flex; flex-wrap: wrap; gap: 8px; }
  .player { width: 300px; height: 200px; background: #fff; }
  .player img, .player iframe, video { width: 300px; height: 200px; display: block; border: 0; object-fit: cover; }
  :fullscreen img, :fullscreen iframe, video:fullscreen { width: 100%; height: 100%; }
</style>
</head>
<body>
<div id="stage" class="player"><img src="photo.svg" alt=""></div>
<video id="clip" poster="photo.svg" muted></video>
<iframe id="embed" class="player" src="https://player.test/embed.html" allow="fullscreen"></iframe>
<div id="wrap" class="player"><iframe src="https://player.test/embed.html"></iframe></div>
<script>
  // Fullscreen needs a click, so the test clicks these; "root" is the whole page, as YouTube does it.
  for (const id of ["stage", "clip", "embed", "wrap", "root"]) {
    const button = Object.assign(document.createElement("button"), { id: `go-${id}`, textContent: id });
    button.addEventListener("click", () => (document.getElementById(id) ?? document.documentElement).requestFullscreen());
    document.body.prepend(button);
  }
</script>
</body>
</html>
