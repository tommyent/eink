<!doctype html>
<!-- An embedded player on another origin, which can make its own player fullscreen (like a video embed). -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Embedded player</title>
<style>
  body { margin: 0; background: #fff; }
  #player { width: 100%; height: 100vh; background: #fff; }
  #player img { width: 100%; height: 100%; display: block; object-fit: cover; }
  #inner { position: fixed; top: 0; left: 0; z-index: 1; }
</style>
</head>
<body>
<button id="inner">fullscreen</button>
<div id="player"><img src="photo.svg" alt=""></div>
<script>document.querySelector("#inner").addEventListener("click", () => document.querySelector("#player").requestFullscreen());</script>
</body>
</html>
