<!doctype html>
<!-- A page built like X: each photo drawn as a CSS background with an invisible <img> over it (the
     way React Native for Web renders images), with filter: brightness(1) in the same inline style,
     as X writes it; a photo viewer opened in-page with history.pushState over a black backdrop;
     a saved dark theme the page switches to late, without a reload; and a frame from another site. -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Social</title>
<style>
  body { margin: 0; font: 15px system-ui; background: #fff; color: #0f1419; }
  main { width: 600px; margin: 0 auto; padding: 16px; }
  .media { position: relative; width: 500px; height: 300px; }
  .media > div { position: absolute; inset: 0; background-size: cover; background-position: center; }
  .media > img { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; }
  #viewer { position: fixed; inset: 0; background: rgba(0, 0, 0, 0.9); display: none; align-items: center; justify-content: center; }
  #viewer .media { width: 900px; height: 600px; }
  #close { position: absolute; top: 8px; left: 8px; }
</style>
</head>
<body>
<main>
  <!-- A profile banner drawn as a background, with the avatar photo inside it: flipped back once, not twice. -->
  <div id="banner" style="filter: brightness(1); background-image: url(&quot;photo.svg&quot;); background-size: 100% 100%; position: relative; width: 500px; height: 120px;"><img id="avatar" src="photo.svg" alt="" style="position: absolute; left: 16px; bottom: 8px; width: 120px; height: 80px;"></div>
  <p>A post with a photo.</p>
  <a id="open" href="/status/1/photo/1"><div id="post-photo" class="media"><div style="filter: brightness(1); background-image: url(&quot;photo.svg&quot;);"></div><img src="photo.svg" alt="Image"></div></a>
  <p><button id="theme">Dark theme</button> <button id="full">Photo fullscreen</button></p>
  <!-- An embedded card from another site, with a photo in it. -->
  <iframe id="card" src="https://player.test/card" title="Card" style="display: block; width: 240px; height: 150px; border: 0;"></iframe>
</main>
<div id="viewer"><button id="close">Close</button><div id="viewer-photo" class="media"><div style="filter: brightness(1); background-image: url(&quot;photo.svg&quot;);"></div><img src="photo.svg" alt="Image"></div></div>
<script>
  const viewer = document.querySelector("#viewer");
  const show = () => { viewer.style.display = location.pathname.endsWith("/photo/1") ? "flex" : "none"; };
  document.querySelector("#open").addEventListener("click", event => { event.preventDefault(); history.pushState(null, "", "/status/1/photo/1"); show(); });
  document.querySelector("#close").addEventListener("click", () => { history.pushState(null, "", "/"); show(); });
  addEventListener("popstate", show);
  document.querySelector("#full").addEventListener("click", () => document.querySelector("#post-photo").requestFullscreen());
  // The account's saved dark theme, applied after load.
  document.querySelector("#theme").addEventListener("click", () => {
    document.body.style.backgroundColor = "#000";
    document.body.style.color = "#e7e9ea";
  });
  show();
</script>
</body>
</html>
