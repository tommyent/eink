<!doctype html>
<html lang="en" data-color-mode="dark" data-light-theme="light" data-dark-theme="dark">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="dark light">
<title>Explicit account theme</title>
<style>
  [data-color-mode="dark"] { --page: #0d1117; --text: #f0f6fc; }
  [data-color-mode="light"] { --page: #fff; --text: #1f2328; }
  html, body { margin: 0; min-height: 100vh; background: var(--page); color: var(--text); }
  #text-swatch { width: 100px; height: 100px; background: var(--text); }
</style>
<script>
  if (location.search === "?light") document.documentElement.dataset.colorMode = "light";
</script>
</head>
<body><div id="text-swatch"></div><p>An explicit account theme with a light design available.</p></body>
</html>
