<!doctype html>
<html lang="en" data-palette="dark">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>E-ink</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main>
      <header>
        <h1>E-ink</h1>
        <div class="preview" aria-hidden="true"><i></i><i></i><i></i></div>
      </header>
      <p id="caption"></p>
      <fieldset id="controls" disabled>
        <fieldset class="row" role="radiogroup" aria-labelledby="mode-legend">
          <legend id="mode-legend">E-ink</legend>
          <div class="segments">
            <label><input type="radio" name="mode" value="on"><span>On</span></label>
            <label><input type="radio" name="mode" value="off"><span>Off</span></label>
            <label><input type="radio" name="mode" value="auto"><span>Auto</span></label>
          </div>
        </fieldset>
        <fieldset id="palette-row" class="row" role="radiogroup" aria-labelledby="palette-legend">
          <legend id="palette-legend">Palette</legend>
          <div class="segments">
            <label><input type="radio" name="palette" value="warm"><span>Warm</span></label>
            <label><input type="radio" name="palette" value="dark"><span>Dark</span></label>
          </div>
        </fieldset>
        <fieldset id="site-row" class="row" role="radiogroup" aria-labelledby="site-legend" aria-describedby="site-name" disabled>
          <legend id="site-legend">This site</legend>
          <div class="segments">
            <label><input type="radio" name="site" value="on"><span>On</span></label>
            <label><input type="radio" name="site" value="off"><span>Off</span></label>
          </div>
        </fieldset>
        <p id="site-name" class="hint"></p>
      </fieldset>
      <p class="hint">Auto turns e-ink on only while the Mac is in dark mode.</p>
      <p id="theme-note" class="hint" hidden>This site's own dark theme is on; the palettes are adjusted for it.</p>
      <p id="status" role="status" aria-live="polite"></p>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
